body.theme-sand-night {

--accent-2: #92400e;

}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background-color: var(--bg-color);
  color: var(--text);
  font-family: var(--font-main);
  overflow-x: hidden;
  padding-bottom: 70px;
}

/* Topbar */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; height: 60px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; z-index: 1000;
}
.topbar-brand { font-weight: 800; font-size: 1.2rem; color: var(--accent); letter-spacing: 1px; }
.topbar-actions { display: flex; gap: 10px; align-items: center; }

/* Buttons */
.btn {
  background: var(--surface-elev); color: var(--text); border: 1px solid var(--border);
  padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; font-size: 14px;
  transition: background 0.2s, opacity 0.2s;
}
.btn:active { opacity: 0.8; }
.btn-primary { background: var(--accent); color: #fff; border: none; }
.btn-mint { background: var(--mint); color: #000; border: none; }
.btn-danger { background: var(--danger); color: #fff; border: none; }
.btn-sm { padding: 4px 8px; font-size: 12px; }

/* Bottom Navigation */
.navbar {
  position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
  background: var(--surface); border-top: 1px solid var(--border);
  display: flex; justify-content: space-around; align-items: center; z-index: 1000;
}
.nav-item {
  display: flex; flex-direction: column; align-items: center;
  color: var(--text-muted); text-decoration: none; font-size: 11px; gap: 4px;
  cursor: pointer; width: 20%;
}
.nav-item.active { color: var(--accent); }

/* Drawers */
.drawer {
  position: fixed; top: 0; bottom: 0; width: 280px; background: var(--surface);
  z-index: 1100; transition: transform 0.3s ease; padding: 20px;
  box-shadow: 0 0 20px rgba(0,0,0,0.5); overflow-y: auto;
}
.drawer-left { left: 0; transform: translateX(-100%); }
.drawer-right { right: 0; transform: translateX(100%); }
.drawer.open { transform: translateX(0); }
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1050; display: none;
}
.overlay.show { display: block; }

/* Content Views */
.container { padding: 76px 16px 20px 16px; max-width: 600px; margin: 0 auto; }
.view-page { display: none; }
.view-page.active { display: block; }

/* Cards */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px; margin-bottom: 16px;
}

/* Forms */
.input-field {
  width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg-color); color: var(--text);
}

/* Filters */
.filter-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
.filter-chip {
  padding: 6px 12px; border-radius: 20px; background: var(--surface-elev);
  font-size: 12px; white-space: nowrap; cursor: pointer; border: 1px solid var(--border);
}
.filter-chip.active { background: var(--accent); color: white; border-color: var(--accent); }

/* Modals */
.modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1200;
  display: none; align-items: center; justify-content: center; padding: 16px;
}
.modal.show { display: flex; }
.modal-content {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; width: 100%; max-width: 500px; max-height: 90vh;
  overflow-y: auto; padding: 20px; position: relative;
}

/* Hub Modal Styles */
#satOskemenHubModal .hub-tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
#satOskemenHubModal .hub-tab { padding: 6px 12px; font-size: 12px; border-radius: 6px; background: var(--surface-elev); color: var(--text-muted); cursor: pointer; border: none; white-space: nowrap; }
#satOskemenHubModal .hub-tab.active { background: var(--accent); color: white; }
.map-svg-container { width: 100%; height: 260px; background: #1a232a; border-radius: 8px; overflow: hidden; position: relative; margin-bottom: 12px; }

/* Fullscreen Chat */
.fullscreen-chat {
  position: fixed; inset: 0; background: var(--bg-color); z-index: 1300;
  display: none; flex-direction: column;
}
.fullscreen-chat.active { display: flex; }
.chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.chat-bubble { max-width: 75%; padding: 8px 12px; border-radius: 12px; font-size: 14px; position: relative; }
.chat-bubble.mine { align-self: flex-end; background: var(--accent); color: white; }
.chat-bubble.other { align-self: flex-start; background: var(--surface-elev); color: var(--text)
; }
</head>

// --- SÄT OSKEMEN HUB MODULE ---
window.SAT_OSKEMEN_HUB = {
  cache: { weather: null, weatherTime: 0, rates: null, ratesTime: 0 },
  markers: JSON.parse(localStorage.getItem('sat_user_markers') || '[]'),

  open: function() {
    document.getElementById('satOskemenHubModal').classList.add('show');
    this.loadWeather();
    this.loadRates();
    this.renderUserMarkers();
  },

  close: function() {
    document.getElementById('satOskemenHubModal').classList.remove('show');
  },

  switchTab: function(tabName) {
    document.querySelectorAll('#satOskemenHubModal .hub-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('#satOskemenHubModal .hub-tab-content').forEach(c => c.style.display = 'none');
    
    const tabs = ['weather', 'rates', 'map', 'highways', 'sos'];
    const idx = tabs.indexOf(tabName);
    if (idx !== -1) {
      document.querySelectorAll('#satOskemenHubModal .hub-tab')[idx].classList.add('active');
    }

    if (tabName === 'weather') document.getElementById('hubTabWeather').style.display = 'block';
    if (tabName === 'rates') document.getElementById('hubTabRates').style.display = 'block';
    if (tabName === 'map') document.getElementById('hubTabMap').style.display = 'block';
    if (tabName === 'highways') document.getElementById('hubTabHighways').style.display = 'block';
    if (tabName === 'sos') document.getElementById('hubTabSos').style.display = 'block';
  },

  loadWeather: function() {
    const now = Date.now();
    if (this.cache.weather && (now - this.cache.weatherTime < 30 * 60 * 1000)) {
      this.renderWeather(this.cache.weather);
      return;
    }
    fetch('https://api.open-meteo.com/v1/forecast?latitude=49.9483&longitude=82.6285&current_weather=true')
      .then(res => res.json())
      .then(data => {
        if (data && data.current_weather) {
          this.cache.weather = data.current_weather;
          this.cache.weatherTime = now;
          this.renderWeather(data.current_weather);
        }
      })
      .catch(() => {
        document.getElementById('hubWeatherStatus').innerText = 'Ошибка загрузки погоды';
      });
  },

  renderWeather: function(w) {
    const temp = Math.round(w.temperature);
    document.getElementById('satOskemenTopTemp').innerText = `🌤 ${temp}°C`;
    document.getElementById('hubWeatherStatus').innerText = `Температура: ${temp}°C`;
    document.getElementById('hubWeatherDetails').innerText = `Скорость ветра: ${w.windspeed} км/ч | Скорость: ${w.winddirection}°`;
  },

  loadRates: function() {
    const now = Date.now();
    if (this.cache.rates && (now - this.cache.ratesTime < 6 * 3600 * 1000)) {
      this.renderRates(this.cache.rates);
      return;
    }
    fetch('https://open.er-api.com/v6/latest/USD')
      .then(res => res.json())
      .then(data => {
        if (data && data.rates && data.rates.KZT) {
          const kzt = data.rates.KZT;
          const rub = data.rates.RUB ? (kzt / data.rates.RUB).toFixed(2) : '--';
          const cny = data.rates.CNY ? (kzt / data.rates.CNY).toFixed(2) : '--';
          const usd = kzt.toFixed(2);
          
          const ratesData = { usd, rub, cny };
          this.cache.rates = ratesData;
          this.cache.ratesTime = now;
          this.renderRates(ratesData);
        }
      })
      .catch(() => {
        document.getElementById('hubRatesList').innerText = 'Ошибка загрузки курсов';
      });
  },

  renderRates: function(r) {
    document.getElementById('hubRatesList').innerHTML = `
      <div style="display:flex; justify-content:space-between;"><span>1 USD</span><b>${r.usd} KZT</b></div>
      <div style="display:flex; justify-content:space-between;"><span>1 RUB</span><b>${r.rub} KZT</b></div>
      <div style="display:flex; justify-content:space-between;"><span>1 CNY</span><b>${r.cny} KZT</b></div>
    `;
  },

  addMarker: function() {
    const title = document.getElementById('hubMarkTitle').value.trim();
    const x = parseInt(document.getElementById('hubMarkX').value);
    const y = parseInt(document.getElementById('hubMarkY').value);
    if (!title || isNaN(x) || isNaN(y)) return;

    this.markers.push({ title, x, y });
    localStorage.setItem('sat_user_markers', JSON.stringify(this.markers));
    document.getElementById('hubMarkTitle').value = '';
    document.getElementById('hubMarkX').value = '';
    document.getElementById('hubMarkY').value = '';
    this.renderUserMarkers();
  },

  renderUserMarkers: function() {
    const g = document.getElementById('hubUserMapMarkers');
    if (!g) return;
    g.innerHTML = '';
    this.markers.forEach((m, idx) => {
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', m.x);
      circle.setAttribute('cy', m.y);
      circle.setAttribute('r', '4');
      circle.setAttribute('fill', '#34d399');
      
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', m.x + 6);
      text.setAttribute('y', m.y + 3);
      text.setAttribute('fill', '#34d399');
      text.setAttribute('font-size', '8');
      text.textContent = m.title;

      g.appendChild(circle);
      g.appendChild(text);
    });
  }
};

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b1f17" />
  <title>SÄT</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icon-512.png" />
  <link rel="apple-touch-icon" href="./icon-512.png" />
  <style>
    :root {
      --bg: #05140e;
      --surface: #0b2218;
      --surface-2: #113022;
      --border: rgba(108, 240, 181, 0.16);
      --accent: #189b62;
      --accent-bright: #6cf0b5;
      --text: #eef8f3;
      --muted: #8fb3a2;
      --danger: #e05252;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .hidden { display: none !important; }

    /* Экран входа */
    #auth-screen {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px; text-align: center;
      background: radial-gradient(circle at top, #123828 0%, #05140e 70%);
    }
    .logo-box {
      width: 96px; height: 96px; border-radius: 26px;
      background: linear-gradient(135deg, #0b261b, #143f2d);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 54px; font-weight: 900; color: var(--accent-bright);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
      margin-bottom: 18px;
    }
    .app-title { font-size: 28px; font-weight: 800; letter-spacing: 1px; margin: 0 0 6px; }
    .app-sub { color: var(--muted); font-size: 14px; margin: 0 0 28px; max-width: 280px; }
    .btn {
      border: none; border-radius: 14px; padding: 14px 20px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-primary { background: var(--accent); color: #fff; width: 100%; max-width: 300px; }
    .btn-primary:active { transform: scale(0.98); }
    .auth-status { margin-top: 14px; font-size: 13px; color: var(--muted); min-height: 18px; }

    /* Основной каркас */
    #app-screen { height: 100%; display: flex; flex-direction: column; }
    header {
      height: 54px; padding: 0 16px;
      display: flex; align-items: center; justify-content: space-between;
      background: #081b13; border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; color: var(--accent-bright); }
    .badge-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-bright); }

    main { flex: 1; overflow-y: auto; padding: 12px; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 12px; margin-bottom: 10px;
    }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .avatar {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--surface-2); color: var(--accent-bright);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 16px; flex-shrink: 0; overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    /* Поля ввода */
    input, textarea {
      width: 100%; background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 10px 12px; font-size: 14px; outline: none; font-family: inherit;
    }
    input:focus, textarea:focus { border-color: var(--accent-bright); }

    /* Пульс */
    .post-author { font-weight: 700; font-size: 14px; }
    .post-time { font-size: 11px; color: var(--muted); }
    .post-text { margin: 8px 0 0; font-size: 14px; line-height: 1.4; white-space: pre-wrap; }

    /* Список чатов */
    .chat-item { cursor: pointer; transition: background 0.15s; }
    .chat-item:active { background: var(--surface-2); }
    .chat-name { font-weight: 700; font-size: 15px; }
    .chat-last { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 210px; }

    /* Нижняя навигация */
    nav {
      height: 58px; background: #081b13; border-top: 1px solid var(--border);
      display: grid; grid-template-columns: repeat(3, 1fr); flex-shrink: 0;
    }
    .nav-btn {
      background: none; border: none; color: var(--muted);
      font-size: 12px; font-weight: 700; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    }
    .nav-btn.active { color: var(--accent-bright); }

    /* Полноэкранный чат */
    #chat-overlay {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; flex-direction: column; z-index: 40;
    }
    #messages-box {
      flex: 1; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .msg {
      max-width: 78%; padding: 9px 12px; border-radius: 15px;
      font-size: 14px; line-height: 1.35; word-break: break-word;
    }
    .msg.me { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
    .msg.them { align-self: flex-start; background: var(--surface-2); color: var(--text); border-bottom-left-radius: 4px; }
    .msg-meta {
      display: flex; align-items: center; justify-content: flex-end; gap: 4px;
      font-size: 10px; opacity: 0.85; margin-top: 3px;
    }
    .chat-input-bar {
      padding: 8px 10px; background: #081b13; border-top: 1px solid var(--border);
      display: flex; gap: 8px; align-items: center;
    }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--accent-bright);
      font-size: 17px; cursor: pointer; flex-shrink: 0;
    }

    /* Всплывающая плашка уведомления */
    #toast {
      position: fixed; top: 12px; left: 12px; right: 12px;
      background: #123828; border: 1px solid var(--accent-bright);
      border-radius: 14px; padding: 12px 14px; z-index: 90;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transform: translateY(-140%); transition: transform 0.25s ease;
      cursor: pointer;
    }
    #toast.show { transform: translateY(0); }

    /* Отдельный экран звонка */
    #call-overlay {
      position: fixed; inset: 0; z-index: 80;
      background: radial-gradient(circle at top, #154531 0%, #04100b 80%);
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: 48px 24px; text-align: center;
    }
    .call-avatar {
      width: 110px; height: 110px; border-radius: 50%;
      background: var(--surface-2); border: 2px solid var(--accent-bright);
      display: flex; align-items: center; justify-content: center;
      font-size: 42px; font-weight: 800; color: var(--accent-bright); margin: 0 auto 16px;
    }
    .call-actions { display: flex; gap: 22px; }
    .call-btn {
      width: 64px; height: 64px; border-radius: 50%; border: none;
      font-size: 24px; color: #fff; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Всплывающее уведомление -->
  <div id="toast">
    <div id="toast-title" style="font-weight:800;font-size:13px;color:var(--accent-bright);">Новое сообщение</div>
    <div id="toast-body" style="font-size:13px;margin-top:2px;"></div>
  </div>

  <!-- Экран входа -->
  <section id="auth-screen">
    <div class="logo-box">Ä</div>
    <h1 class="app-title">SÄT</h1>
    <p class="app-sub">Живой пульс, люди рядом, чаты и звонки в одном приложении.</p>
    <button id="google-login-btn" class="btn btn-primary">Продолжить через Google</button>
    <div id="auth-status" class="auth-status"></div>
  </section>

  <!-- Главный экран -->
  <section id="app-screen" class="hidden">
    <header>
      <div class="brand"><span class="badge-dot"></span> SÄT</div>
      <div id="header-user" style="font-size:12px;color:var(--muted);"></div>
    </header>

    <main>
      <!-- Вкладка Пульс -->
      <div id="tab-pulse">
        <div class="card">
          <textarea id="pulse-input" rows="2" placeholder="Что нового? Поделитесь в Пульсе..."></textarea>
          <div style="display:flex;justify-content:flex-end;margin-top:8px;">
            <button id="publish-post-btn" class="btn btn-primary" style="width:auto;padding:9px 16px;font-size:13px;">Опубликовать</button>
          </div>
        </div>
        <div id="pulse-feed"></div>
      </div>

      <!-- Вкладка Чаты -->
      <div id="tab-chats" class="hidden">
        <div class="card">
          <input id="user-search" type="text" placeholder="Найти человека по имени или @нику..." />
        </div>
        <div id="users-list"></div>
      </div>

      <!-- Вкладка Профиль -->
      <div id="tab-profile" class="hidden">
        <div class="card" style="text-align:center;padding:20px;">
          <div id="profile-avatar" class="avatar" style="width:72px;height:72px;font-size:28px;margin:0 auto 10px;">Ä</div>
          <div id="profile-name" style="font-weight:800;font-size:18px;"></div>
          <div id="profile-email" style="font-size:12px;color:var(--muted);margin-bottom:14px;"></div>
          <input id="profile-nick" type="text" placeholder="Ваш @никнейм" style="margin-bottom:10px;" />
          <input id="profile-bio" type="text" placeholder="Коротко о себе" style="margin-bottom:12px;" />
          <button id="save-profile-btn" class="btn btn-primary" style="max-width:none;margin-bottom:10px;">Сохранить профиль</button>
          <button id="logout-btn" class="btn" style="width:100%;background:var(--surface-2);color:var(--danger);">Выйти из аккаунта</button>
        </div>
      </div>
    </main>

    <nav>
      <button class="nav-btn active" data-tab="pulse">⚡<span>Пульс</span></button>
      <button class="nav-btn" data-tab="chats">💬<span>Чаты</span></button>
      <button class="nav-btn" data-tab="profile">👤<span>Профиль</span></button>
    </nav>
  </section>

  <!-- Полноэкранный чат -->
  <section id="chat-overlay" class="hidden">
    <header>
      <div class="row">
        <button id="close-chat-btn" class="icon-btn">←</button>
        <div>
          <div id="chat-peer-name" style="font-weight:800;font-size:15px;">Чат</div>
          <div style="font-size:11px;color:var(--accent-bright);">в сети</div>
        </div>
      </div>
      <div class="row">
        <button id="audio-call-btn" class="icon-btn" title="Аудиозвонок">📞</button>
        <button id="video-call-btn" class="icon-btn" title="Видеозвонок">📹</button>
      </div>
    </header>
    <div id="messages-box"></div>
    <div class="chat-input-bar">
      <input id="msg-input" type="text" placeholder="Сообщение..." />
      <button id="send-msg-btn" class="icon-btn" style="background:var(--accent);color:#fff;">➤</button>
    </div>
  </section>

  <!-- Отдельный экран звонка -->
  <section id="call-overlay" class="hidden">
    <div>
      <div id="call-type-label" style="font-size:13px;color:var(--accent-bright);letter-spacing:1px;text-transform:uppercase;">Аудиозвонок SÄT</div>
      <div style="margin-top:28px;">
        <div id="call-peer-avatar" class="call-avatar">Ä</div>
        <div id="call-peer-name" style="font-size:24px;font-weight:800;">Пользователь</div>
        <div id="call-timer" style="font-size:14px;color:var(--muted);margin-top:6px;">Соединение...</div>
      </div>
    </div>
    <div class="call-actions">
      <button id="end-call-btn" class="call-btn" style="background:var(--danger);">✕</button>
    </div>
  </section>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect,
      getRedirectResult, onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore, collection, doc, setDoc, getDoc, addDoc, updateDoc,
      query, orderBy, limit, onSnapshot, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ЗАМЕНИТЕ НА ДАННЫЕ ИЗ ВАШЕГО ПРОЕКТА FIREBASE (sat-oskemen)
    const firebaseConfig = {
      apiKey: "ВАШ_API_KEY",
      authDomain: "sat-oskemen.firebaseapp.com",
      projectId: "sat-oskemen",
      storageBucket: "sat-oskemen.appspot.com",
      messagingSenderId: "ВАШ_SENDER_ID",
      appId: "ВАШ_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let activePeer = null;
    let unsubMessages = null;
    let callInterval = null;
    let allUsers = [];

    // Звуковые сигналы через Web Audio API
    function playTone(freq, duration = 0.12, type = "sine") {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch {}
    }
    const soundSend = () => playTone(620, 0.09, "triangle");
    const soundReceive = () => { playTone(520, 0.1); setTimeout(() => playTone(740, 0.14), 110); };
    const soundPost = () => playTone(460, 0.14, "sine");

    function showToast(title, text) {
      const t = document.getElementById("toast");
      document.getElementById("toast-title").textContent = title;
      document.getElementById("toast-body").textContent = text;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 3200);
    }

    // Вход через Google (поддержка и обычного браузера, и PWA ярлыка)
    const authStatus = document.getElementById("auth-status");
    getRedirectResult(auth).catch((e) => {
      if (e?.message) authStatus.textContent = "Ошибка входа: " + e.message;
    });

    document.getElementById("google-login-btn").addEventListener("click", async () => {
      authStatus.textContent = "Открываем вход Google...";
      const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;
      try {
        if (isStandalone) {
          await signInWithRedirect(auth, provider);
        } else {
          await signInWithPopup(auth, provider);
        }
      } catch (err) {
        try {
          await signInWithRedirect(auth, provider);
        } catch (e2) {
          authStatus.textContent = "Ошибка: " + (e2.message || err.message);
        }
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        currentUser = null;
        document.getElementById("auth-screen").classList.remove("hidden");
        document.getElementById("app-screen").classList.add("hidden");
        return;
      }
      currentUser = user;
      document.getElementById("auth-screen").classList.add("hidden");
      document.getElementById("app-screen").classList.remove("hidden");
      document.getElementById("header-user").textContent = user.displayName || "";

      const userRef = doc(db, "users", user.uid);
      const snap = await getDoc(userRef);
      if (!snap.exists()) {
        await setDoc(userRef, {
          uid: user.uid,
          name: user.displayName || "Пользователь SÄT",
          email: user.email || "",
          photo: user.photoURL || "",
          nick: "@" + (user.email ? user.email.split("@")[0] : user.uid.slice(0, 6)),
          bio: "",
          updatedAt: serverTimestamp()
        });
      }
      loadProfile();
      subscribePulse();
      subscribeUsers();
    });

    // Навигация по вкладкам
    document.querySelectorAll(".nav-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".nav-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const tab = btn.dataset.tab;
        ["pulse", "chats", "profile"].forEach((t) => {
          document.getElementById("tab-" + t).classList.toggle("hidden", t !== tab);
        });
      });
    });

    // Пульс
    document.getElementById("publish-post-btn").addEventListener("click", async () => {
      const input = document.getElementById("pulse-input");
      const text = input.value.trim();
      if (!text || !currentUser) return;
      input.value = "";
      await addDoc(collection(db, "pulse"), {
        uid: currentUser.uid,
        author: currentUser.displayName || "Участник SÄT",
        text,
        createdAt: serverTimestamp()
      });
      soundPost();
    });

    function subscribePulse() {
      const q = query(collection(db, "pulse"), orderBy("createdAt", "desc"), limit(30));
      onSnapshot(q, (snap) => {
        const feed = document.getElementById("pulse-feed");
        feed.innerHTML = "";
        snap.forEach((d) => {
          const p = d.data();
          const el = document.createElement("div");
          el.className = "card";
          el.innerHTML = `
            <div class="row">
              <div class="post-author">${escapeHtml(p.author || "SÄT")}</div>
              <div class="post-time">Пульс</div>
            </div>
            <div class="post-text">${escapeHtml(p.text || "")}</div>
          `;
          feed.appendChild(el);
        });
      });
    }

    // Пользователи и чаты
    function subscribeUsers() {
      onSnapshot(collection(db, "users"), (snap) => {
        allUsers = [];
        snap.forEach((d) => {
          if (d.id !== currentUser.uid) allUsers.push(d.data());
        });
        renderUsers(document.getElementById("user-search").value);
      });
    }

    document.getElementById("user-search").addEventListener("input", (e) => {
      renderUsers(e.target.value);
    });

    function renderUsers(filter = "") {
      const list = document.getElementById("users-list");
      list.innerHTML = "";
      const q = filter.trim().toLowerCase();
      const filtered = allUsers.filter((u) =>
        (u.name || "").toLowerCase().includes(q) || (u.nick || "").toLowerCase().includes(q)
      );
      if (!filtered.length) {
        list.innerHTML = `<div style="text-align:center;color:var(--muted);padding:20px;font-size:13px;">Пока никого не найдено</div>`;
        return;
      }
      filtered.forEach((u) => {
        const el = document.createElement("div");
        el.className = "card chat-item row";
        const initial = (u.name || "Ä")[0].toUpperCase();
        el.innerHTML = `
          <div class="row">
            <div class="avatar">${u.photo ? `<img src="${u.photo}" alt="" />` : initial}</div>
            <div>
              <div class="chat-name">${escapeHtml(u.name || "Пользователь")}</div>
              <div class="chat-last">${escapeHtml(u.nick || "")}</div>
            </div>
          </div>
          <span style="color:var(--accent-bright);font-size:13px;">Чат →</span>
        `;
        el.addEventListener("click", () => openChat(u));
        list.appendChild(el);
      });
    }

    function getChatId(uid1, uid2) {
      return [uid1, uid2].sort().join("_");
    }

    function openChat(peer) {
      activePeer = peer;
      document.getElementById("chat-peer-name").textContent = peer.name || "Чат";
      document.getElementById("chat-overlay").classList.remove("hidden");
      if (unsubMessages) unsubMessages();

      const chatId = getChatId(currentUser.uid, peer.uid);
      const q = query(collection(db, "chats", chatId, "messages"), orderBy("createdAt", "asc"), limit(100));
      let firstLoad = true;

      unsubMessages = onSnapshot(q, (snap) => {
        const box = document.getElementById("messages-box");
        box.innerHTML = "";
        snap.forEach((d) => {
          const m = d.data();
          const isMe = m.senderId === currentUser.uid;
          if (!isMe && !m.read) {
            updateDoc(doc(db, "chats", chatId, "messages", d.id), { read: true }).catch(() => {});
          }
          const div = document.createElement("div");
          div.className = "msg " + (isMe ? "me" : "them");
          const ticks = isMe ? (m.read ? "✓✓" : "✓") : "";
          div.innerHTML = `
            <div>${escapeHtml(m.text || "")}</div>
            <div class="msg-meta"><span>${ticks}</span></div>
          `;
          box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;

        if (!firstLoad) {
          const changes = snap.docChanges();
          changes.forEach((c) => {
            if (c.type === "added") {
              const m = c.doc.data();
              if (m.senderId !== currentUser.uid) {
                soundReceive();
                showToast(peer.name || "Новое сообщение", m.text || "");
              }
            }
          });
        }
        firstLoad = false;
      });
    }

    document.getElementById("close-chat-btn").addEventListener("click", () => {
      document.getElementById("chat-overlay").classList.add("hidden");
      if (unsubMessages) unsubMessages();
      activePeer = null;
    });

    async function sendMessage() {
      const input = document.getElementById("msg-input");
      const text = input.value.trim();
      if (!text || !activePeer || !currentUser) return;
      input.value = "";
      const chatId = getChatId(currentUser.uid, activePeer.uid);
      await addDoc(collection(db, "chats", chatId, "messages"), {
        senderId: currentUser.uid,
        text,
        read: false,
        createdAt: serverTimestamp()
      });
      soundSend();
    }

    document.getElementById("send-msg-btn").addEventListener("click", sendMessage);
    document.getElementById("msg-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    // Экран звонка
    function startCall(type) {
      if (!activePeer) return;
      document.getElementById("call-type-label").textContent =
        type === "video" ? "Видеозвонок SÄT" : "Аудиозвонок SÄT";
      document.getElementById("call-peer-name").textContent = activePeer.name || "Пользователь";
      document.getElementById("call-peer-avatar").textContent = (activePeer.name || "Ä")[0].toUpperCase();
      document.getElementById("call-overlay").classList.remove("hidden");

      let sec = 0;
      const timerEl = document.getElementById("call-timer");
      timerEl.textContent = "Вызов...";
      clearInterval(callInterval);
      callInterval = setInterval(() => {
        sec++;
        const mm = String(Math.floor(sec / 60)).padStart(2, "0");
        const ss = String(sec % 60).padStart(2, "0");
        timerEl.textContent = `${mm}:${ss}`;
      }, 1000);
    }

    document.getElementById("audio-call-btn").addEventListener("click", () => startCall("audio"));
    document.getElementById("video-call-btn").addEventListener("click", () => startCall("video"));
    document.getElementById("end-call-btn").addEventListener("click", () => {
      clearInterval(callInterval);
      document.getElementById("call-overlay").classList.add("hidden");
    });

    // Профиль
    async function loadProfile() {
      const snap = await getDoc(doc(db, "users", currentUser.uid));
      if (!snap.exists()) return;
      const u = snap.data();
      document.getElementById("profile-name").textContent = u.name || "";
      document.getElementById("profile-email").textContent = u.email || "";
      document.getElementById("profile-nick").value = u.nick || "";
      document.getElementById("profile-bio").value = u.bio || "";
      if (u.photo) {
        document.getElementById("profile-avatar").innerHTML = `<img src="${u.photo}" alt="" />`;
      }
    }

    document.getElementById("save-profile-btn").addEventListener("click", async () => {
      await updateDoc(doc(db, "users", currentUser.uid), {
        nick: document.getElementById("profile-nick").value.trim(),
        bio: document.getElementById("profile-bio").value.trim(),
        updatedAt: serverTimestamp()
      });
      showToast("Профиль", "Изменения сохранены");
    });

    document.getElementById("logout-btn").addEventListener("click", () => signOut(auth));

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (s) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[s]));
    }

    // Регистрация Service Worker
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
